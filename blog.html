<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — The Boneyard</title>
  <meta name="description" content="Knight Shadow's blog posts from Cyberspace, mirrored on The Boneyard companion site.">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="" data-page="blog">
  <div class="crt flicker" id="app">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header id="site-header"></header>
    <div class="shell">
      <nav id="site-nav" aria-label="Site"></nav>
      <main id="content" class="content">
        <article class="page">
          <p class="kicker">Main Board / Blog</p>
          <h1>Blog</h1>
          <p class="lede">Posts from Knight Shadow on <a href="https://cyberspace.online/knightshadow/blog" target="_blank" rel="noopener">Cyberspace</a>. New entries show up here from the RSS feed.</p>
          <div id="blog-feed" class="blog-feed" aria-live="polite">
            <p class="note">Calling the board&hellip; pulling the latest posts.</p>
          </div>
        </article>
      </main>
    </div>
    <footer id="site-footer"></footer>
  </div>
  <script src="js/site.js"></script>
  <script src="js/blog.js"></script>

</html>
